          readOnly: true
          title: Origen
        origin_label:
          type: string
          readOnly: true
        author_name:
          type: string
          readOnly: true
          title: Autor
        width:
          type: integer
          readOnly: true
        height:
          type: integer
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        created_at:
          type: string

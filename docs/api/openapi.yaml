        - id y public_code son de solo lectura e inmutables.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        public_code:
          type: string
          readOnly: true
          title: Código PetTech
          description: Identificador público para compartir con la veterinaria. No
            otorga acceso.
        name:
          type: string
          title: Nombre
          maxLength: 60
        species:
          allOf:
          - $ref: '#/components/schemas/SpeciesEnum'
          title: Especie
        species_label:
          type: string
          readOnly: true
        breed:
          type: string
          title: Raza
          maxLength: 60
        sex:
          allOf:
          - $ref: '#/components/schemas/SexEnum'
          title: Sexo
        sex_label:
          type: string
          readOnly: true
        birth_date:
          type: string
          format: date
          nullable: true
          title: Fecha de nacimiento
        birth_date_is_estimated:
          type: boolean
          title: Fecha aproximada
          description: Indica si la fecha de nacimiento es estimada.
        microchip_number:
          type: string
          title: Número de microchip (declarado)
          description: Declarado por el tutor; PetTech no lo verifica contra el Registro
            Nacional.
          pattern: ^\d{15}$
          maxLength: 15
        general_notes:
          type: string
          title: Antecedentes generales declarados por el tutor
          maxLength: 1000
        data_origin:
          type: string
          readOnly: true
          description: 'Origen de los datos del perfil: siempre declarados por el
            tutor.'
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creado el
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Actualizado el
      required:
      - created_at
      - data_origin
      - id
      - name
      - public_code
      - sex_label
      - species
      - species_label
      - updated_at
    PetRequest:
      type: object
      description: |-
        Perfil de mascota (HU-02) y datos del carnet digital.

        - El tutor NUNCA se recibe desde el cliente: se asigna a partir del token (perform_create).
        - id y public_code son de solo lectura e inmutables.
      properties:
        name:
          type: string
          minLength: 1
          title: Nombre
          maxLength: 60
        species:
          allOf:
          - $ref: '#/components/schemas/SpeciesEnum'
          title: Especie
        breed:
          type: string
          title: Raza
          maxLength: 60
        sex:
          allOf:
          - $ref: '#/components/schemas/SexEnum'
          title: Sexo
        birth_date:
          type: string
          format: date
          nullable: true
          title: Fecha de nacimiento
        birth_date_is_estimated:
          type: boolean
          title: Fecha aproximada
          description: Indica si la fecha de nacimiento es estimada.
        microchip_number:
          type: string
          title: Número de microchip (declarado)
          description: Declarado por el tutor; PetTech no lo verifica contra el Registro
            Nacional.
          pattern: ^\d{15}$
          maxLength: 15
        general_notes:
          type: string
          title: Antecedentes generales declarados por el tutor
          maxLength: 1000
      required:
      - name
      - species
    RegisterRequest:
      type: object
      description: |-
        Registro de TUTORES (HU-01).

        El rol no es elegible por el cliente: las cuentas profesionales se crean y verifican
        desde el panel de administración (Fase 2). Cualquier campo "role" enviado se ignora.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        accept_privacy_policy:
          type: boolean
          writeOnly: true
      required:
      - accept_privacy_policy
      - email
      - full_name
      - password
    ResultEnum:
      enum:
      - SUCCESS
      - DENIED
      type: string
      description: |-
        * `SUCCESS` - Permitido
        * `DENIED` - Denegado
    RoleEnum:
      enum:
      - TUTOR
      - PROFESSIONAL
      - CLINIC
      - ADMIN
      type: string
      description: |-
        * `TUTOR` - Tutor (propietario de mascotas)
        * `PROFESSIONAL` - Profesional veterinario
        * `CLINIC` - Veterinaria (establecimiento)
        * `ADMIN` - Administrador de PetTech
    RouteEnum:
      enum:
      - SC
      - IM
      - ORAL
      - INTRANASAL
      - TOPICAL
      - IV
      type: string
      description: |-
        * `SC` - Subcutánea
        * `IM` - Intramuscular
        * `ORAL` - Oral
        * `INTRANASAL` - Intranasal
        * `TOPICAL` - Tópica
        * `IV` - Intravenosa
    SexEnum:
      enum:
      - MALE
      - FEMALE
      - UNKNOWN
      type: string
      description: |-
        * `MALE` - Macho
        * `FEMALE` - Hembra
        * `UNKNOWN` - No informado
    SpeciesEnum:
      enum:
      - DOG
      - CAT
      type: string
      description: |-
        * `DOG` - Perro
        * `CAT` - Gato
    User:
      type: object
      description: Datos públicos de la cuenta propia (nunca incluye contraseña ni
        tokens).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Correo electrónico
        full_name:
          type: string
          readOnly: true
          title: Nombre completo
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rol
        role_label:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de registro
      required:
      - date_joined
      - email
      - full_name
      - id
      - role
      - role_label
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Lunes
        * `1` - Martes
        * `2` - Miércoles
        * `3` - Jueves
        * `4` - Viernes
        * `5` - Sábado
        * `6` - Domingo

openapi: 3.0.3
info:
  title: PetTech API
  version: 2.0.0-incremento2
  description: 'API REST del prototipo PetTech (Proyecto de Título TIH184, INACAP).
    Incremento 2: cuentas, mascotas, ficha clínica estandarizada, acceso de veterinarias
    por código PetTech con autorización del tutor, bitácora y búsqueda de establecimientos.'
paths:
  /api/v1/access/pets/{pet_id}/log/:
    get:
      operationId: access_pets_log_list
      description: El tutor ve quién consultó o modificó la ficha de su mascota (HU-24).
      summary: Bitácora de accesos de una mascota
      parameters:
      - in: path
        name: pet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
          description: ''
  /api/v1/access/requests/:
    get:
      operationId: access_requests_list
      description: |-
        GET: tutor → solicitudes sobre sus mascotas; profesional → solicitudes que él realizó.
        POST (profesional): solicitar acceso ingresando el código PetTech (HU-16).
      summary: Listar solicitudes de acceso
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: PENDING, APPROVED, ...
      tags:
      - access
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequest'
          description: ''
    post:
      operationId: access_requests_create
      description: |-
        GET: tutor → solicitudes sobre sus mascotas; profesional → solicitudes que él realizó.
        POST (profesional): solicitar acceso ingresando el código PetTech (HU-16).
      summary: Solicitar acceso con el código PetTech (profesional)
      tags:
      - access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
  /api/v1/access/requests/{id}/approve/:
    post:
      operationId: access_requests_approve_create
      description: El tutor autoriza por 24 h (configurable) al establecimiento solicitante
        (HU-17, RN-12).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
  /api/v1/access/requests/{id}/reject/:
    post:
      operationId: access_requests_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
  /api/v1/access/requests/{id}/revoke/:
    post:
      operationId: access_requests_revoke_create
      description: Revocación con efecto inmediato (HU-18).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
  /api/v1/auth/account-deletion/:
    post:
      operationId: auth_account_deletion_create
      description: El titular solicita eliminar su cuenta desde la app. Se registra
        y se cierran sus sesiones.
      tags:
      - auth
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Inicia sesión con correo y contraseña (HU-01). Limitado a 10 intentos
        por minuto.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoca el token utilizado en la solicitud (cierre de sesión en
        este dispositivo).
      tags:
      - auth
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: Sesión cerrada
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      description: Revoca todos los tokens del usuario (cierre de sesión en todos
        los dispositivos).
      tags:
      - auth
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: Sesiones cerradas
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Devuelve los datos de la cuenta autenticada.
      tags:
      - auth
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Solicita un código de recuperación (HU-01). No revela si el correo
        existe.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Crea una nueva contraseña con el código recibido; cierra las sesiones
        anteriores.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Crea una cuenta de TUTOR y devuelve un token de sesión (HU-01).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/clinics/:
    get:
      operationId: clinics_list
      description: |-
        Búsqueda de establecimientos cercanos con filtros combinables (HU-07, HU-08).
        Orden: abiertos según horario declarado primero; luego por distancia.
      summary: Buscar veterinarias (cercanía y filtros)
      parameters:
      - in: query
        name: emergency
        schema:
          type: boolean
          default: false
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
      - in: query
        name: lng
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: network
        schema:
          type: boolean
          default: false
        description: Solo veterinarias de la Red PetTech.
      - in: query
        name: open_now
        schema:
          type: boolean
          default: false
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
          maximum: 50
          minimum: 1
          default: 10.0
      - in: query
        name: service
        schema:
          enum:
          - GENERAL
          - VACCINATION
          - SURGERY
          - LAB
          - IMAGING
          - HOSPITALIZATION
          - EXOTICS
          type: string
          minLength: 1
        description: |-
          * `GENERAL` - Consulta general
          * `VACCINATION` - Vacunación
          * `SURGERY` - Cirugía
          * `LAB` - Laboratorio
          * `IMAGING` - Imagenología
          * `HOSPITALIZATION` - Hospitalización
          * `EXOTICS` - Animales exóticos
      tags:
      - clinics
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clinic'
          description: ''
  /api/v1/clinics/{id}/:
    get:
      operationId: clinics_retrieve
      summary: Ficha de un establecimiento (HU-09)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinics
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
          description: ''
  /api/v1/clinics/services/:
    get:
      operationId: clinics_services_retrieve
      summary: Servicios disponibles para filtrar
      tags:
      - clinics
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: |-
        Verificación de salud para monitoreo (NS-01) y para que la app compruebe la conexión.

        Confirma que la base de datos responde y que la extensión PostGIS está disponible.
        No expone versiones ni detalles internos.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/v1/pets/:
    get:
      operationId: pets_list
      description: |-
        Mascotas del tutor autenticado (HU-02, RNF-02).

        Autorización a nivel de objeto: el queryset se filtra SIEMPRE por el tutor del token.
        Una mascota ajena responde 404 (no 403) para no revelar su existencia.
      summary: Listar mis mascotas
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - pets
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPetList'
          description: ''
    post:
      operationId: pets_create
      description: |-
        Mascotas del tutor autenticado (HU-02, RNF-02).

        Autorización a nivel de objeto: el queryset se filtra SIEMPRE por el tutor del token.
        Una mascota ajena responde 404 (no 403) para no revelar su existencia.
      summary: Registrar una mascota
      tags:
      - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
          description: ''
  /api/v1/pets/{pet_id}/clinical-record/:
    get:
      operationId: pets_clinical_record_retrieve
      description: 'Ficha clínica de una mascota propia: antecedentes declarados y
        registros de veterinarias (HU-04, HU-23).'
      summary: Ficha clínica (tutor)
      parameters:
      - in: path
        name: pet_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: type
        schema:
          type: string
        description: 'Filtra por tipo: VACCINE, DEWORMING, VISIT, ALLERGY, CHRONIC_CONDITION,
          SURGERY, MEDICATION, WEIGHT'
      tags:
      - clinical-records
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/pets/{pet_id}/clinical-record/attachments/:
    post:
      operationId: pets_clinical_record_attachments_create
      summary: Adjuntar foto (etiqueta de vacuna o carnet)
      parameters:
      - in: path
        name: pet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinical-records
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/pets/{pet_id}/clinical-record/attachments/{attachment_id}/:
    get:
      operationId: pets_clinical_record_attachments_retrieve
      summary: Ver la foto (JPEG)
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinical-records
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
    delete:
      operationId: pets_clinical_record_attachments_destroy
      summary: Eliminar una foto propia
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinical-records
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
  /api/v1/pets/{pet_id}/clinical-record/entries/:
    post:
      operationId: pets_clinical_record_entries_create
      summary: Registrar antecedente declarado (HU-03)
      parameters:
      - in: path
        name: pet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinical-records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalEntryRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalEntry'
          description: ''
  /api/v1/pets/{pet_id}/clinical-record/entries/{entry_id}/correct/:
    post:
      operationId: pets_clinical_record_entries_correct_create
      summary: Corregir un antecedente declarado
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinical-records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalEntry'
          description: ''
  /api/v1/pets/{pet_id}/clinical-record/entries/{entry_id}/history/:
    get:
      operationId: pets_clinical_record_entries_history_list
      summary: Versiones de un antecedente
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinical-records
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClinicalEntry'
          description: ''
  /api/v1/pets/{id}/:
    get:
      operationId: pets_retrieve
      description: |-
        Mascotas del tutor autenticado (HU-02, RNF-02).

        Autorización a nivel de objeto: el queryset se filtra SIEMPRE por el tutor del token.
        Una mascota ajena responde 404 (no 403) para no revelar su existencia.
      summary: Ver una mascota propia (carnet digital)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - pets
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
          description: ''
    put:
      operationId: pets_update
      description: |-
        Mascotas del tutor autenticado (HU-02, RNF-02).

        Autorización a nivel de objeto: el queryset se filtra SIEMPRE por el tutor del token.
        Una mascota ajena responde 404 (no 403) para no revelar su existencia.
      summary: Reemplazar los datos de una mascota propia
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
          description: ''
    patch:
      operationId: pets_partial_update
      description: |-
        Mascotas del tutor autenticado (HU-02, RNF-02).

        Autorización a nivel de objeto: el queryset se filtra SIEMPRE por el tutor del token.
        Una mascota ajena responde 404 (no 403) para no revelar su existencia.
      summary: Editar una mascota propia
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPetRequest'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
          description: ''
    delete:
      operationId: pets_destroy
      description: |-
        Mascotas del tutor autenticado (HU-02, RNF-02).

        Autorización a nivel de objeto: el queryset se filtra SIEMPRE por el tutor del token.
        Una mascota ajena responde 404 (no 403) para no revelar su existencia.
      summary: Eliminar una mascota propia
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - pets
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
  /api/v1/professional/me/:
    get:
      operationId: professional_me_retrieve
      description: Establecimiento verificado al que pertenece el profesional.
      summary: Mi establecimiento
      tags:
      - professional
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/professional/pets/{code}/clinical-record/:
    get:
      operationId: professional_pets_clinical_record_retrieve
      description: |-
        Ficha clínica para un profesional con autorización VIGENTE del tutor (HU-19).
        Se verifica en cada consulta y cada lectura queda en la bitácora (RNF-09, RNF-10).
      summary: Ficha clínica por código PetTech
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: query
        name: type
        schema:
          type: string
        description: 'Filtra por tipo: VACCINE, DEWORMING, VISIT, ALLERGY, CHRONIC_CONDITION,
          SURGERY, MEDICATION, WEIGHT'
      tags:
      - professional
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/professional/pets/{code}/clinical-record/attachments/:
    post:
      operationId: professional_pets_clinical_record_attachments_create
      summary: Adjuntar foto de la etiqueta a un registro propio
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - professional
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/professional/pets/{code}/clinical-record/attachments/{attachment_id}/:
    get:
      operationId: professional_pets_clinical_record_attachments_retrieve
      summary: Ver una foto de la ficha (JPEG)
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - professional
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/professional/pets/{code}/clinical-record/entries/:
    post:
      operationId: professional_pets_clinical_record_entries_create
      summary: Registrar atención, vacuna u otro antecedente (HU-20, HU-21)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - professional
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalEntryRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalEntry'
          description: ''
  /api/v1/professional/pets/{code}/clinical-record/entries/{entry_id}/correct/:
    post:
      operationId: professional_pets_clinical_record_entries_correct_create
      summary: Corregir un registro del propio establecimiento (HU-22)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - professional
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
        required: true
      security:

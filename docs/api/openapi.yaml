        info_origin_label:
          type: string
          readOnly: true
        verified_at:
          type: string
          format: date-time
          title: Fecha de última verificación
        is_stale:
          type: boolean
          readOnly: true
          description: La información supera el umbral de antigüedad.
        accepts_pettech_records:
          type: boolean
          title: Participa en la red PetTech
          description: Sus profesionales verificados pueden solicitar acceso y registrar
            atenciones.
        in_pettech_network:
          type: boolean

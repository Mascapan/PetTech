    Clinic:
      type: object
      description: |-
        Ficha del establecimiento (HU-09): horario, servicios, urgencias y contacto, con el ORIGEN
        y la FECHA de verificación de la información. No incluye cupos ni promete atención inmediata.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nombre
          maxLength: 120
        address:
          type: string
          title: Dirección
          maxLength: 200
        commune:
          type: string
          title: Comuna
          maxLength: 60
        phone:
          type: string
          title: Teléfono
          maxLength: 20
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        distance_km:
          type: number
          format: double
          nullable: true
          readOnly: true
        attends_emergencies:
          type: boolean
          title: Declara atender urgencias
        emergency_24h:
          type: boolean
          title: Declara atención 24 horas
        services:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        is_open_now:
          type: boolean
          readOnly: true
          description: Calculado con el horario declarado y la hora actual. No confirma

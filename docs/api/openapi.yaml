components:
  schemas:
    AccessRequest:
      type: object
      description: |-
        Vista de una solicitud. El nombre de la mascota se muestra al profesional SOLO si la
        autorización está vigente; antes de eso solo ve el código que él mismo ingresó.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        status_label:
          type: string
          readOnly: true
        pet_id:
          type: string
          nullable: true
          readOnly: true
        pet_code:
          type: string
          readOnly: true
        pet_name:
          type: string
          nullable: true
          readOnly: true
        clinic_id:
          type: string
          format: uuid
          readOnly: true
        clinic_name:
          type: string
          readOnly: true
        professional_name:
          type: string
          readOnly: true
        reason:
          type: string
          title: Motivo de la solicitud
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 'Pendiente: plazo para responder. Autorizada: fin de la autorización.'
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - clinic_id
      - clinic_name
      - created_at
      - id
      - pet_code
      - pet_id
      - pet_name
      - professional_name
      - status
      - status_label
    AccessRequestCreateRequest:
      type: object
      properties:
        public_code:
          type: string
          minLength: 1
          maxLength: 20
        reason:
          type: string
          default: ''
          maxLength: 200
      required:
      - public_code
    ActionEnum:
      enum:
      - ACCESS_REQUESTED
      - ACCESS_APPROVED
      - ACCESS_REJECTED
      - ACCESS_REVOKED
      - RECORD_READ
      - RECORD_CREATED
      - RECORD_CORRECTED
      - CATALOG_UPDATED
      - PROFESSIONAL_AUTHORIZED
      - PROFESSIONAL_SUSPENDED
      - CLINIC_CREATED
      - PASSWORD_CHANGED
      - CLINIC_AFFILIATED
      - DIRECTORY_UPDATED
      - ATTACHMENT_ADDED
      - ATTACHMENT_READ
      type: string
      description: |-
        * `ACCESS_REQUESTED` - Solicitó acceso
        * `ACCESS_APPROVED` - Autorizó acceso
        * `ACCESS_REJECTED` - Rechazó acceso
        * `ACCESS_REVOKED` - Revocó acceso
        * `RECORD_READ` - Consultó la ficha clínica
        * `RECORD_CREATED` - Registró un antecedente
        * `RECORD_CORRECTED` - Corrigió un antecedente
        * `CATALOG_UPDATED` - Actualizó la información del establecimiento
        * `PROFESSIONAL_AUTHORIZED` - Autorizó a un profesional
        * `PROFESSIONAL_SUSPENDED` - Suspendió a un profesional
        * `CLINIC_CREATED` - Creó una veterinaria
        * `PASSWORD_CHANGED` - Cambió su contraseña
        * `CLINIC_AFFILIATED` - Afilió una veterinaria a la red
        * `DIRECTORY_UPDATED` - Actualizó el directorio de veterinarias
        * `ATTACHMENT_ADDED` - Adjuntó una fotografía a la ficha
        * `ATTACHMENT_READ` - Vio una fotografía de la ficha
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:

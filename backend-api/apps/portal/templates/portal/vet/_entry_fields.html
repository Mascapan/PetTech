{% load portal_extras %}
<div class="field"><label for="f_type">Tipo de antecedente</label>
<select id="f_type" name="entry_type" {% if lock_type %}disabled{% endif %}>{% for t in types %}<option value="{{ t.value }}" {% if t.value == v_type %}selected{% endif %}>{{ t.label }}</option>{% endfor %}</select>
{% if lock_type %}<input type="hidden" name="entry_type" value="{{ v_type }}">{% endif %}
<div class="err">{{ errors|get_item:"entry_type" }}</div></div>
<div class="field"><label for="f_title">Descripción</label><input id="f_title" type="text" name="title" value="{{ v_title }}" placeholder="Vacuna, motivo, alergia, fármaco y dosis…" maxlength="120"><div class="err">{{ errors|get_item:"title" }}</div></div>
<div class="grid g2">
<div class="field"><label for="f_date">Fecha</label><input id="f_date" type="date" name="occurred_on" value="{{ v_date }}"><div class="err">{{ errors|get_item:"occurred_on" }}</div></div>
<div class="field"><label for="f_next">Próxima fecha (opcional)</label><input id="f_next" type="date" name="next_due_on" value="{{ v_next }}"><div class="help">Refuerzo, próximo control o fin del tratamiento.</div><div class="err">{{ errors|get_item:"next_due_on" }}</div></div>
<div class="field"><label for="f_w">Peso en kg (opcional)</label><input id="f_w" type="number" step="0.01" min="0.05" max="150" name="weight_kg" value="{{ v_weight }}"><div class="err">{{ errors|get_item:"weight_kg" }}</div></div>
<div class="field"><label for="f_lot">Lote / serie (vacunas)</label><input id="f_lot" type="text" name="lot_number" value="{{ v_lot }}" maxlength="40"></div>
</div>
<div class="field inline"><input id="f_act" type="checkbox" name="is_active" {% if v_active %}checked{% endif %}><label for="f_act">Vigente (alergias, patologías y fármacos)</label></div>
<div class="field"><label for="f_notes">Observaciones, procedimiento o tratamiento</label><textarea id="f_notes" name="notes" rows="3" maxlength="2000">{{ v_notes }}</textarea></div>
